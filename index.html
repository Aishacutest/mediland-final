<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - Pro 1000 Pics</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/file-saver@2.0.5/dist/FileSaver.min.js"></script>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f4f6f8}
.header{position:sticky;top:0;z-index:100;background:#fff;padding:12px 15px;box-shadow:0 2px 8px rgba(0,0,0,.1);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{padding:10px 18px;border:none;border-radius:8px;cursor:pointer;font-weight:bold;color:#fff}
.btn-blue{background:#0d6efd}.btn-red{background:#dc3545}.btn-green{background:#198754}.btn-dark{background:#212529}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:15px}
.stat-card{background:#fff;padding:15px;border-radius:12px;text-align:center;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.stat-card h2{margin:5px 0;color:#0d6efd}
#selectedBar{display:none;position:sticky;top:68px;z-index:99;background:#fff3cd;border:2px solid #ffc107;padding:10px 15px;justify-content:space-between;align-items:center;border-radius:10px;margin:10px 15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:15px;padding:15px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.1);position:relative}
.card img{width:100%;height:200px;object-fit:cover;background:#eee}
.card-body{padding:10px}
.card input[type=checkbox]{position:absolute;top:10px;left:10px;width:22px;height:22px;z-index:2}
.worker-table{background:#fff;margin:15px;border-radius:12px;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.worker-table table{width:100%;border-collapse:collapse}
.worker-table th,.worker-table td{padding:12px 10px;border-bottom:1px solid #eee;text-align:left;font-size:14px}
.progress{width:90%;height:20px;background:#e9ecef;border-radius:10px;overflow:hidden;margin:10px auto;display:none}
.progress div{height:100%;background:#0d6efd;width:0%;transition:.2s}
</style>
</head>
<body>

<div class="header">
  <h3 style="margin:0;flex:1">Admin Panel - Pro</h3>
  <input type="date" id="dateFilter">
  <button class="btn btn-blue" onclick="loadData(true)">Filter / Reload</button>
  <button class="btn btn-green" onclick="exportAll()">Export ALL (500+ 1 Click)</button>
  <button class="btn btn-dark" onclick="loadData(false)">Load More 100</button>
</div>

<div id="selectedBar">
  <span id="selCount" style="font-weight:bold">0 Selected</span>
  <div style="display:flex;gap:8px">
    <button class="btn btn-green" onclick="downloadSelected()">Download Selected ZIP</button>
    <button class="btn btn-red" onclick="deleteSelected()">Delete Selected</button>
    <button class="btn btn-dark" onclick="clearSelection()">Cancel</button>
  </div>
</div>

<div class="stats">
  <div class="stat-card"><small>Total Photos</small><h2 id="totalCount">0</h2></div>
  <div class="stat-card"><small>Loaded on Screen</small><h2 id="filteredCount">0</h2></div>
  <div class="stat-card"><small>Selected</small><h2 id="selectedStat">0</h2></div>
</div>

<div class="worker-table">
  <h3 style="padding:14px 15px;margin:0;border-bottom:1px solid #eee">Worker Overview - All Workers Performance</h3>
  <table id="workerTable"><thead><tr><th>Worker Name</th><th>Total (Loaded)</th><th>Today Uploads</th><th>Last Active</th></tr></thead><tbody></tbody></table>
</div>

<div class="progress" id="progBox"><div id="progBar"></div></div>
<div id="progText" style="text-align:center;margin:8px;font-weight:bold;display:none"></div>

<div class="grid" id="grid"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, query, where, orderBy, limit, startAfter, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ====== YAHAN CHANGE KARNA HAI 1 - Apna firebaseConfig paste karein ======
const firebaseConfig = {
  apiKey: "PASTE YOUR KEY",
  authDomain: "mediland-app.firebaseapp.com",
  projectId: "mediland-app",
  storageBucket: "mediland-app.appspot.com",
  messagingSenderId: "PASTE",
  appId: "PASTE"
};
// ====== YAHAN CHANGE KARNA HAI 2 - Collection ka naam ======
const COLLECTION = "billings"; // agar aapka naam photos hai to "photos" likh dein

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

let allDocs = [];
let lastVisible = null;
let selectedIds = new Set();
let selectedData = new Map();

window.loadData = async function(reset=true){
  if(reset){ document.getElementById('grid').innerHTML=''; allDocs=[]; lastVisible=null; selectedIds.clear(); selectedData.clear(); updateSelectedBar(); }
  const dateVal = document.getElementById('dateFilter').value;
  let q;
  try{
    if(dateVal){
      q = query(collection(db,COLLECTION), where("date","==",dateVal), orderBy("timestamp","desc"), limit(100));
    } else {
      if(lastVisible) q = query(collection(db,COLLECTION), orderBy("timestamp","desc"), startAfter(lastVisible), limit(100));
      else q = query(collection(db,COLLECTION), orderBy("timestamp","desc"), limit(100));
    }
    const snap = await getDocs(q);
    if(snap.docs.length>0) lastVisible = snap.docs[snap.docs.length-1];
    snap.forEach(d=>{ const data={id:d.id,...d.data()}; allDocs.push(data); renderCard(data); });
    document.getElementById('filteredCount').innerText = allDocs.length;
    updateWorkerTable(); getTotalCount();
  }catch(e){ alert("Error: "+e.message+"\nCollection naam check karein"); }
}

function renderCard(data){
  const grid = document.getElementById('grid');
  const div = document.createElement('div'); div.className='card';
  const imgSrc = data.imageBase64 || data.imageUrl || data.url || '';
  div.innerHTML = `
    <input type="checkbox" onchange="toggleSelect('${data.id}', this.checked)">
    <img src="${imgSrc}" loading="lazy" onerror="this.src='https://via.placeholder.com/300?text=No+Image'">
    <div class="card-body">
      <b style="color:#0d6efd;font-size:13px">Ref: ${data.ref || data.ward || ''} # ${data.refNo || data.id.slice(0,6)}</b><br>
      <small>👤 ${data.workerName || data.worker || 'Unknown'}</small><br>
      <small>${data.timestamp? new Date(data.timestamp.seconds*1000).toLocaleString() : ''}</small>
    </div>
  `;
  grid.appendChild(div);
}

window.toggleSelect = function(id,checked){
  const data = allDocs.find(x=>x.id===id);
  if(checked){ selectedIds.add(id); selectedData.set(id,data); }
  else{ selectedIds.delete(id); selectedData.delete(id); }
  updateSelectedBar();
}

window.clearSelection = function(){
  selectedIds.clear(); selectedData.clear();
  document.querySelectorAll('.card input[type=checkbox]').forEach(c=>c.checked=false);
  updateSelectedBar();
}

function updateSelectedBar(){
  const bar = document.getElementById('selectedBar');
  const c = selectedIds.size;
  document.getElementById('selCount').innerText = c+" Selected";
  document.getElementById('selectedStat').innerText = c;
  bar.style.display = c>0? 'flex' : 'none';
}

async function fetchAllFilteredDocsForExport(){
  let all = []; let last = null;
  const dateVal = document.getElementById('dateFilter').value;
  while(true){
    let q;
    if(dateVal) q = query(collection(db,COLLECTION), where("date","==",dateVal), orderBy("timestamp","desc"), limit(400),...(last?[startAfter(last)]:[]));
    else q = query(collection(db,COLLECTION), orderBy("timestamp","desc"), limit(400),...(last?[startAfter(last)]:[]));
    const snap = await getDocs(q);
    if(snap.empty) break;
    snap.forEach(d=> all.push({id:d.id,...d.data()}));
    if(snap.docs.length<400) break;
    last = snap.docs[snap.docs.length-1];
    if(all.length>=2000) break;
  }
  return all;
}

window.exportAll = async function(){
  const progBox=document.getElementById('progBox'); const progBar=document.getElementById('progBar'); const progText=document.getElementById('progText');
  progBox.style.display='block'; progText.style.display='block'; progText.innerText="Fetching all photos (500+ bhi)...";
  const docs = await fetchAllFilteredDocsForExport();
  if(docs.length===0){ alert("No photos"); progBox.style.display='none'; progText.style.display='none'; return; }
  const zip = new JSZip();
  for(let i=0;i<docs.length;i++){
    const d=docs[i];
    try{
      let b64 = d.imageBase64 || "";
      if(b64.includes(',')) b64 = b64.split(',')[1];
      if(b64) zip.file(`${d.refNo || d.id}.jpg`, b64, {base64:true});
    }catch(e){}
    let pct=Math.round((i/docs.length)*100);
    progBar.style.width=pct+'%';
    progText.innerText=`Zipping ${i+1}/${docs.length} (${pct}%)`;
    if(i%80===0) await new Promise(r=>setTimeout(r,5));
  }
  progText.innerText="Downloading ZIP...";
  const blob = await zip.generateAsync({type:"blob"});
  saveAs(blob, `ALL_${docs.length}_Photos_${new Date().toISOString().slice(0,10)}.zip`);
  progBox.style.display='none'; progText.style.display='none';
  alert(docs.length+" Photos 1 ZIP me ho gayi!");
}

window.downloadSelected = async function(){
  if(selectedData.size===0) return;
  const zip=new JSZip();
  for(let [id,d] of selectedData){
    try{
      let b64=d.imageBase64||""; if(b64.includes(',')) b64=b64.split(',')[1];
      if(b64) zip.file(`${d.refNo||id}.jpg`, b64, {base64:true});
    }catch(e){}
  }
  const blob=await zip.generateAsync({type:"blob"});
  saveAs(blob, `Selected_${selectedData.size}.zip`);
}

window.deleteSelected = async function(){
  if(!confirm(selectedIds.size+" photos delete karni hain?")) return;
  for(let id of selectedIds){ await deleteDoc(doc(db,COLLECTION,id)); }
  alert("Deleted"); clearSelection(); loadData(true);
}

async function getTotalCount(){
  try{ const snap=await getDocs(collection(db,COLLECTION)); document.getElementById('totalCount').innerText=snap.size; }catch(e){}
}

function updateWorkerTable(){
  const map={}; const todayStr=new Date().toISOString().slice(0,10);
  allDocs.forEach(d=>{
    const w=d.workerName||d.worker||'Unknown';
    if(!map[w]) map[w]={total:0,today:0,last:''};
    map[w].total++;
    const dStr=d.date|| (d.timestamp? new Date(d.timestamp.seconds*1000).toISOString().slice(0,10):'');
    if(dStr===todayStr) map[w].today++;
    const t=d.timestamp? new Date(d.timestamp.seconds*1000).toLocaleString():'';
    if(!map[w].last || t>map[w].last) map[w].last=t;
  });
  const tbody=document.querySelector('#workerTable tbody'); tbody.innerHTML='';
  Object.entries(map).forEach(([name,info])=>{
    const tr=document.createElement('tr');
    tr.innerHTML=`<td><b>${name}</b></td><td>${info.total}</td><td>${info.today}</td><td>${info.last}</td>`;
    tbody.appendChild(tr);
  });
}
loadData(true);
</script>
</body>
</html>
