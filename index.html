<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mediland App - Bill Distribution Portal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

  <!-- Firebase SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { 
      getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy 
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCeZZ3EUkuKC0tfVdGatyIyxFfNo2ktZW4",
      authDomain: "mediland-app.firebaseapp.com",
      projectId: "mediland-app",
      storageBucket: "mediland-app.firebasestorage.app",
      messagingSenderId: "401966804808",
      appId: "1:401966804808:web:c866b3750e826bbf3fcd7d",
      measurementId: "G-PQK4BMDZEK"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    window.db = db;
    window.dbOps = { collection, addDoc, onSnapshot, doc, updateDoc, deleteDoc, query, orderBy };
  </script>

  <style>
    .glass { background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(12px); }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans">

  <!-- Header Navigation Tabs -->
  <header class="border-b border-slate-800 bg-slate-950/80 sticky top-0 z-50 p-4 shadow-md">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <div class="bg-indigo-600 text-white font-bold px-3 py-1.5 rounded-lg text-lg">M</div>
        <h1 class="font-bold text-xl tracking-wide text-indigo-400">Mediland Portal</h1>
      </div>
      <!-- Persistent Tabs (No Logout Needed) -->
      <div class="flex space-x-2 bg-slate-900 p-1 rounded-xl border border-slate-800">
        <button id="btnWorkerTab" onclick="accessTab('worker')" class="px-4 py-2 rounded-lg font-medium bg-indigo-600 text-white text-sm transition flex items-center space-x-1">
          <span>👷 Worker Portal</span>
        </button>
        <button id="btnAdminTab" onclick="accessTab('admin')" class="px-4 py-2 rounded-lg font-medium bg-slate-800 text-slate-400 text-sm transition hover:bg-slate-700 flex items-center space-x-1">
          <span>🔒 Admin Portal</span>
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-4 md:p-6">

    <!-- WORKER SECTION -->
    <section id="workerSection" class="space-y-6">
      <div class="bg-slate-800/80 p-6 rounded-2xl border border-slate-700 shadow-xl max-w-xl mx-auto">
        <h2 class="text-xl font-semibold text-white mb-4 flex items-center">
          <span class="mr-2">📸</span> Submit New Record
        </h2>
        
        <form id="uploadForm" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-400 mb-1">Worker Name / ID</label>
            <input type="text" id="workerName" required placeholder="Enter your name" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-indigo-500">
          </div>

          <div>
            <label class="block text-sm font-medium text-slate-400 mb-1">Bill / Field Photo</label>
            <input type="file" id="imageInput" accept="image/*" capture="environment" required class="w-full text-slate-400 text-sm file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-indigo-600 file:text-white hover:file:bg-indigo-500 cursor-pointer">
          </div>

          <div id="locationStatus" class="p-3 rounded-xl bg-slate-900/60 border border-slate-700/60 text-xs text-slate-400">
            📍 Location status: Pending image capture...
          </div>

          <button type="submit" id="submitBtn" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 rounded-xl shadow-lg transition flex items-center justify-center space-x-2">
            <span>Upload Stamped Record</span>
          </button>
        </form>
      </div>
    </section>

    <!-- ADMIN SECTION -->
    <section id="adminSection" class="hidden space-y-6">
      <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 bg-slate-800/40 p-4 rounded-xl border border-slate-700">
        <div>
          <h2 class="text-xl font-bold text-white">Central Admin Dashboard</h2>
          <p class="text-xs text-slate-400">Real-time synchronized record gallery</p>
        </div>

        <div class="flex flex-wrap gap-2">
          <button onclick="exportCSV()" class="px-3.5 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold rounded-lg shadow">Export CSV</button>
          <button onclick="exportZIP()" class="px-3.5 py-2 bg-purple-600 hover:bg-purple-500 text-white text-xs font-semibold rounded-lg shadow">Export ZIP (Photos)</button>
        </div>
      </div>

      <!-- Filters -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
        <input type="text" id="searchWorker" oninput="filterRecords()" placeholder="Filter by worker name..." class="bg-slate-800 border border-slate-700 text-sm rounded-xl px-4 py-2 text-white focus:outline-none">
        <input type="date" id="filterDate" onchange="filterRecords()" class="bg-slate-800 border border-slate-700 text-sm rounded-xl px-4 py-2 text-white focus:outline-none">
        <button onclick="clearFilters()" class="bg-slate-700 hover:bg-slate-600 text-xs rounded-xl px-4 py-2 text-slate-300">Clear Filters</button>
      </div>

      <!-- Gallery Grid -->
      <div id="galleryGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
        <div class="col-span-full text-center py-10 text-slate-500">Loading live records...</div>
      </div>
    </section>

  </main>

  <script>
    let allRecords = [];

    // PIN Configuration
    const ADMIN_PIN = "1234";  // Default Admin PIN
    const WORKER_PIN = "0000"; // Default Worker PIN (Keep empty "" if no PIN needed for Worker)

    function accessTab(tab) {
      if (tab === 'admin') {
        const enteredPin = prompt("🔑 Enter Admin Access PIN:");
        if (enteredPin === ADMIN_PIN) {
          switchTab('admin');
        } else if (enteredPin !== null) {
          alert("❌ Incorrect Admin PIN!");
        }
      } else if (tab === 'worker') {
        if (WORKER_PIN !== "") {
          const enteredPin = prompt("🔑 Enter Worker Access PIN:");
          if (enteredPin === WORKER_PIN) {
            switchTab('worker');
          } else if (enteredPin !== null) {
            alert("❌ Incorrect Worker PIN!");
          }
        } else {
          switchTab('worker');
        }
      }
    }

    function switchTab(tab) {
      const workerSec = document.getElementById('workerSection');
      const adminSec = document.getElementById('adminSection');
      const btnWorker = document.getElementById('btnWorkerTab');
      const btnAdmin = document.getElementById('btnAdminTab');

      if (tab === 'worker') {
        workerSec.classList.remove('hidden');
        adminSec.classList.add('hidden');
        btnWorker.className = "px-4 py-2 rounded-lg font-medium bg-indigo-600 text-white text-sm transition flex items-center space-x-1";
        btnAdmin.className = "px-4 py-2 rounded-lg font-medium bg-slate-800 text-slate-400 text-sm transition hover:bg-slate-700 flex items-center space-x-1";
      } else {
        workerSec.classList.add('hidden');
        adminSec.classList.remove('hidden');
        btnAdmin.className = "px-4 py-2 rounded-lg font-medium bg-indigo-600 text-white text-sm transition flex items-center space-x-1";
        btnWorker.className = "px-4 py-2 rounded-lg font-medium bg-slate-800 text-slate-400 text-sm transition hover:bg-slate-700 flex items-center space-x-1";
      }
    }

    // Reverse Geocoding for Detailed Location
    async function getAddressFromGPS(lat, lng) {
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}&zoom=18&addressdetails=1`);
        const data = await res.json();
        if (data && data.address) {
          const a = data.address;
          const road = a.road || a.pedestrian || a.suburb || '';
          const area = a.neighbourhood || a.village || a.residential || a.hamlet || '';
          const city = a.city || a.town || a.county || a.state_district || '';
          const country = a.country || '';
          
          let fullAddr = [road, area, city, country].filter(Boolean).join(', ');
          return fullAddr || "Detailed Location Acquired";
        }
      } catch (err) {
        console.log("Geocoding failed");
      }
      return `GPS Loc: ${lat.toFixed(5)}, ${lng.toFixed(5)}`;
    }

    // Stamp ONLY GPS Location, Date & Time onto Photo (NO Worker Name or Ref No)
    const createGPSStampedImage = (file, address, lat, lng) => new Promise((resolve) => {
      const reader = new FileReader();
      reader.readAsDataURL(file);
      reader.onload = (e) => {
        const img = new Image();
        img.src = e.target.result;
        img.onload = () => {
          const canvas = document.createElement('canvas');
          const maxWidth = 1000;
          const scaleSize = maxWidth / img.width;
          canvas.width = maxWidth;
          canvas.height = img.height * scaleSize;

          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

          // Overlay Box at bottom
          const boxHeight = 120;
          ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
          ctx.fillRect(0, canvas.height - boxHeight, canvas.width, boxHeight);

          // Accent side-bar
          ctx.fillStyle = "#6366f1";
          ctx.fillRect(0, canvas.height - boxHeight, 10, boxHeight);

          // Text Formatting
          ctx.fillStyle = "#ffffff";
          ctx.font = "bold 22px sans-serif";
          
          const now = new Date();
          const dateStr = now.toLocaleDateString('en-GB', { day: '2-digit', month: 'short', year: 'numeric' });
          const timeStr = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

          // 1. Full Detailed Address
          ctx.fillText(`📍 ${address}`, 22, canvas.height - boxHeight + 40);
          
          // 2. Latitude & Longitude
          ctx.font = "18px sans-serif";
          ctx.fillStyle = "#cbd5e1";
          ctx.fillText(`Lat: ${lat.toFixed(6)}°  |  Long: ${lng.toFixed(6)}°`, 22, canvas.height - boxHeight + 75);
          
          // 3. Date & Time
          ctx.fillText(`📅 ${dateStr} ${timeStr}`, 22, canvas.height - boxHeight + 105);

          resolve(canvas.toDataURL('image/jpeg', 0.65));
        };
      };
    });

    // Form Submit
    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const submitBtn = document.getElementById('submitBtn');
      const statusDiv = document.getElementById('locationStatus');
      submitBtn.disabled = true;
      submitBtn.innerText = "Fetching location & stamping photo...";

      const workerName = document.getElementById('workerName').value.trim();
      const fileInput = document.getElementById('imageInput');
      
      if(!fileInput.files[0]) {
        alert("Please select or capture a photo.");
        submitBtn.disabled = false;
        submitBtn.innerText = "Upload Stamped Record";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        async (position) => {
          const lat = position.coords.latitude;
          const lng = position.coords.longitude;
          statusDiv.innerText = `📍 Fetching road & area name...`;

          try {
            const address = await getAddressFromGPS(lat, lng);
            statusDiv.innerText = `📍 Address: ${address}`;

            // Create stamped image without Worker Name or Ref No
            const stampedBase64 = await createGPSStampedImage(fileInput.files[0], address, lat, lng);
            
            const recordData = {
              workerName: workerName, // Saved in database for admin filtering only
              imageUrl: stampedBase64,
              address: address,
              lat: lat,
              lng: lng,
              timestamp: new Date().toISOString(),
              formattedDate: new Date().toLocaleDateString(),
              formattedTime: new Date().toLocaleTimeString()
            };

            const { collection, addDoc } = window.dbOps;
            await addDoc(collection(window.db, "bill_records"), recordData);

            alert("GPS Stamped photo successfully uploaded!");
            document.getElementById('uploadForm').reset();
            statusDiv.innerText = "📍 Location status: Pending image capture...";
          } catch (err) {
            alert("Error saving record: " + err.message);
          } finally {
            submitBtn.disabled = false;
            submitBtn.innerText = "Upload Stamped Record";
          }
        },
        (error) => {
          alert("GPS Permission required to submit records!");
          statusDiv.innerText = "❌ GPS Permission Denied. Access required.";
          submitBtn.disabled = false;
          submitBtn.innerText = "Upload Stamped Record";
        },
        { enableHighAccuracy: true }
      );
    });

    // Firestore Sync
    window.addEventListener('DOMContentLoaded', () => {
      const checkFirebase = setInterval(() => {
        if (window.db && window.dbOps) {
          clearInterval(checkFirebase);
          initRealtimeSync();
        }
      }, 300);
    });

    function initRealtimeSync() {
      const { collection, onSnapshot, query, orderBy } = window.dbOps;
      const q = query(collection(window.db, "bill_records"), orderBy("timestamp", "desc"));

      onSnapshot(q, (snapshot) => {
        allRecords = [];
        snapshot.forEach((doc) => {
          allRecords.push({ id: doc.id, ...doc.data() });
        });
        renderGallery(allRecords);
      });
    }

    function renderGallery(records) {
      const gallery = document.getElementById('galleryGrid');
      if(records.length === 0) {
        gallery.innerHTML = `<div class="col-span-full text-center py-10 text-slate-500">No records found.</div>`;
        return;
      }

      gallery.innerHTML = records.map(rec => `
        <div class="bg-slate-800 border border-slate-700 rounded-xl overflow-hidden shadow-lg">
          <img src="${rec.imageUrl}" class="w-full h-52 object-cover bg-slate-900" alt="Bill Record">
          <div class="p-4 space-y-2">
            <div class="flex justify-between items-center">
              <span class="font-bold text-indigo-400 text-sm">Submitted By: ${rec.workerName}</span>
              <span class="text-xs text-slate-400">${rec.formattedDate} ${rec.formattedTime}</span>
            </div>
            <p class="text-xs text-slate-300 font-medium truncate">🏠 ${rec.address || 'Address recorded on image'}</p>
            <div class="text-xs text-slate-300">
              📍 <a href="https://maps.google.com/?q=${rec.lat},${rec.lng}" target="_blank" class="underline text-indigo-300">View Map (${rec.lat.toFixed(4)}, ${rec.lng.toFixed(4)})</a>
            </div>
            <div class="flex space-x-2 pt-2 border-t border-slate-700">
              <button onclick="editRecord('${rec.id}', '${rec.workerName}')" class="text-xs bg-slate-700 hover:bg-slate-600 px-2.5 py-1 rounded text-slate-200">Edit</button>
              <button onclick="deleteRecord('${rec.id}')" class="text-xs bg-red-600/80 hover:bg-red-500 px-2.5 py-1 rounded text-white">Delete</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function filterRecords() {
      const search = document.getElementById('searchWorker').value.toLowerCase();
      const date = document.getElementById('filterDate').value;

      const filtered = allRecords.filter(rec => {
        const matchesName = rec.workerName.toLowerCase().includes(search);
        const matchesDate = !date || rec.timestamp.startsWith(date);
        return matchesName && matchesDate;
      });

      renderGallery(filtered);
    }

    function clearFilters() {
      document.getElementById('searchWorker').value = '';
      document.getElementById('filterDate').value = '';
      renderGallery(allRecords);
    }

    async function deleteRecord(id) {
      if(confirm("Are you sure you want to delete this record?")) {
        const { doc, deleteDoc } = window.dbOps;
        await deleteDoc(doc(window.db, "bill_records", id));
      }
    }

    async function editRecord(id, oldName) {
      const newName = prompt("Edit Worker Name:", oldName);
      if(newName && newName.trim() !== '') {
        const { doc, updateDoc } = window.dbOps;
        await updateDoc(doc(window.db, "bill_records", id), { workerName: newName.trim() });
      }
    }

    function exportCSV() {
      if(allRecords.length === 0) return alert("No data to export!");
      let csv = "ID,Worker Name,Detailed Address,Date,Time,Latitude,Longitude\n";
      allRecords.forEach(r => {
        csv += `"${r.id}","${r.workerName}","${r.address || ''}","${r.formattedDate}","${r.formattedTime}","${r.lat}","${r.lng}"\n`;
      });
      const blob = new Blob([csv], { type: 'text/csv' });
      saveAs(blob, `mediland_records_${new Date().toISOString().slice(0,10)}.csv`);
    }

    function exportZIP() {
      if(allRecords.length === 0) return alert("No images to export!");
      const zip = new JSZip();
      const imgFolder = zip.folder("mediland_photos");

      allRecords.forEach((r, idx) => {
        const base64Data = r.imageUrl.split(',')[1];
        imgFolder.file(`${r.workerName}_${idx+1}.jpg`, base64Data, {base64: true});
      });

      zip.generateAsync({type:"blob"}).then(content => {
        saveAs(content, "mediland_photos.zip");
      });
    }
  </script>
</body>
</html>
