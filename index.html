<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>MEDILAND - Bills Distribution</title>
<style>*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}body{background:#eef5ee}
.header-new{display:flex;align-items:center;justify-content:space-between;background:#0a3d2a;padding:10px 8px;gap:8px}
.logo-box{background:#fff;border-radius:14px;padding:6px;width:120px;height:90px;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 2px 5px rgba(0,0,0,0.2)}
.logo-box img{max-width:100%;max-height:100%;object-fit:contain}
.center{text-align:center;flex:1;color:#fff}
.center h1{font-size:24px;color:#ffeb3b;line-height:1.1;font-weight:900;letter-spacing:0.5px}
.center p{font-size:10.5px;margin:4px 0;color:#e5e7eb}.center h2{font-size:15px;color:#ffeb3b;margin-top:3px}
.top-tabs{display:flex;background:#fff;border-bottom:2px solid #064e3b;position:sticky;top:0;z-index:10}
.top-tabs button{flex:1;padding:13px;border:none;background:#f3f4f6;font-weight:700;cursor:pointer;color:#666}
.top-tabs button.active{background:#fff;color:#111;border-bottom:3px solid #064e3b}
.card{background:#fff;border-radius:14px;padding:14px;margin:10px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.label{font-size:12px;font-weight:700;margin:9px 0 4px;display:block}.input,.select{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;font-size:13px}
.btn{padding:10px;border-radius:8px;border:1px solid #ddd;font-weight:700;cursor:pointer}.btn-green{background:#064e3b;color:#fff;width:100%;margin-top:10px;padding:13px;font-size:14px}
.gps-box{padding:9px;border-radius:8px;font-size:12px;border:1px solid #fecaca;background:#fee2e2}.gps-ok{background:#d1fae5;border-color:#10b981}
.detail{background:#eff6ff;border:1px solid #bfdbfe;border-radius:8px;padding:7px;font-size:11px;margin-top:6px}
canvas{display:none}
</style></head><body>
<div class="top-tabs"><button class="active">Worker App</button><button onclick="location.href='admin.html'">Admin Portal</button></div>

<div class="header-new">
<div class="logo-box"><img src="mediland-logo.jpg"></div>
<div class="center"><h1>BILLS DISTRIBUTION</h1><p>Mediland Pakistan Pvt Ltd - Suthra Punjab Agency - Tehsil Toba Tek Singh</p><h2>بلوں کی تقسیم - ستھرا پنجاب</h2></div>
<div class="logo-box"><img src="suthra-logo.jpg"></div>
</div>

<div class="card">
<label class="label">Select Distributor *</label>
<select id="distributor" class="select"><option value="">-- Choose Your Name --</option><option>Mr Hanan</option><option>Mr Zubair</option><option>Ms Anila</option><option>Mr Waris Ali</option><option>Mr Faraz Ahmed</option><option>Mr Samiullah</option><option>Mr Zahid</option><option>Mr Faizan Javed</option><option>Mr Hussnain</option><option>Mr Usman</option></select>
<label class="label">House REF / Meter No *</label><input id="refNo" class="input" placeholder="e.g. METER-98745">
<label class="label">LIVE GPS *</label><div id="gpsStatus" class="gps-box">📍 Waiting for LIVE GPS...</div>
<button class="btn" style="width:100%;margin:6px 0;background:#fbbf24" onclick="refreshGPS()">🔄 Refresh LIVE GPS</button>
<label class="label">Full Address (Auto Detail)</label><textarea id="liveAddr" class="input" style="height:65px" readonly placeholder="Road / Chak / UC / Tehsil auto..."></textarea>
<div id="addrDetail" class="detail">Full detail after GPS...</div>
<label class="label">House / Meter Photo *</label><div style="border:1px dashed #aaa;border-radius:8px;padding:8px"><input type="file" id="photo" accept="image/*" capture="environment"><img id="imgPreview" style="display:none;width:100%;border-radius:8px;margin-top:6px"><div id="photoName" style="font-size:11px;color:#666;margin-top:4px">No file chosen</div></div>
<button class="btn btn-green" onclick="submitData()">Submit Data - Big Font Stamp</button>
<div id="msg" style="text-align:center;font-weight:700;font-size:12px;margin-top:8px;color:#065f46"></div>
</div>
<canvas id="canvas"></canvas>
<script>
let gpsLat=null,gpsLong=null,currentImg=null,records=JSON.parse(localStorage.getItem('mediland_records_v2')||'[]'),photos=JSON.parse(localStorage.getItem('mediland_photos_v2')||'[]');
function refreshGPS(){let b=document.getElementById('gpsStatus');b.innerHTML="⏳ LIVE GPS + Full Address fetching...";b.className="gps-box";navigator.geolocation.getCurrentPosition(p=>{gpsLat=p.coords.latitude;gpsLong=p.coords.longitude;let acc=Math.round(p.coords.accuracy);b.innerHTML=`✅ LIVE: ${gpsLat.toFixed(6)}, ${gpsLong.toFixed(6)} (±${acc}m)`;b.className="gps-box gps-ok";fetch(`https://nominatim.openstreetmap.org/reverse?lat=${gpsLat}&lon=${gpsLong}&format=json&addressdetails=1`).then(r=>r.json()).then(d=>{let a=d.address||{};document.getElementById('liveAddr').value=d.display_name||`${gpsLat},${gpsLong}`;document.getElementById('addrDetail').innerHTML=`<b>Road:</b> ${a.road||a.suburb||'N/A'} | <b>Village:</b> ${a.village||a.town||a.city||'Toba'}<br><b>Tehsil:</b> ${a.county||'Toba Tek Singh'} | <b>District:</b> ${a.state_district||'Faisalabad'}`;});},e=>{b.innerHTML="❌ Allow Location - GPS on karo";},{enableHighAccuracy:true,timeout:20000,maximumAge:0});}
refreshGPS();
document.getElementById('photo').addEventListener('change',e=>{let f=e.target.files[0];if(!f)return;document.getElementById('photoName').innerText=f.name;let r=new FileReader();r.onload=ev=>{currentImg=new Image();currentImg.onload=()=>{document.getElementById('imgPreview').src=ev.target.result;document.getElementById('imgPreview').style.display='block';};currentImg.src=ev.target.result;};r.readAsDataURL(f);});
function submitData(){let d=document.getElementById('distributor').value,ref=document.getElementById('refNo').value.trim(),addr=document.getElementById('liveAddr').value;if(!d||!ref||!gpsLat||!currentImg){alert('Name, REF, GPS, Photo lazmi!');return;}let rec={id:Date.now(),name:d,ref:ref,gps:`${gpsLat.toFixed(6)}, ${gpsLong.toFixed(6)}`,addr:addr,date:new Date().toISOString().slice(0,10),time:new Date().toLocaleString()};let cv=document.getElementById('canvas'),ctx=cv.getContext('2d');cv.width=currentImg.width;cv.height=currentImg.height;ctx.drawImage(currentImg,0,0);let h=cv.height,w=cv.width,sh=Math.floor(h*0.38),bf=Math.max(28,Math.floor(h*0.034));ctx.fillStyle="rgba(0,0,0,0.88)";ctx.fillRect(0,h-sh,w,sh);ctx.fillStyle="#fff";ctx.font=`900 ${bf}px Arial`;ctx.fillText(rec.name,20,h-sh+bf+10);ctx.fillStyle="#facc15";ctx.font=`bold ${Math.floor(bf*0.8)}px Arial`;let lines=addr.match(/.{1,50}/g)||[addr];lines.slice(0,2).forEach((ln,i)=>{ctx.fillText(ln,20,h-sh+bf+14+Math.floor(bf*0.8)*(i+1));});ctx.fillStyle="#fff";ctx.font=`${Math.floor(bf*0.55)}px Arial`;ctx.fillText(`REF: ${ref} | GPS: ${rec.gps} | ${rec.time}`,20,h-10);let stamped=cv.toDataURL('image/jpeg',0.92);records.push(rec);photos.push({id:rec.id,ref:ref,data:stamped});localStorage.setItem('mediland_records_v2',JSON.stringify(records));localStorage.setItem('mediland_photos_v2',JSON.stringify(photos));let a=document.createElement('a');a.download=`${d}_${ref}_LIVE.jpg`;a.href=stamped;a.click();document.getElementById('msg').innerHTML=`✅ Saved! ${d} - ${ref}`;document.getElementById('refNo').value='';currentImg=null;}
</script></body></html>
