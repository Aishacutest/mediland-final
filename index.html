<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>MEDILAND - Bills Distribution</title>
<style>*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}body{background:#eef2ee}.header-new{display:flex;align-items:center;justify-content:space-between;background:#0a3d2a;padding:8px 10px;gap:8px}.logo-box{background:#fff;border-radius:12px;padding:5px;width:115px;height:80px;display:flex;align-items:center;justify-content:center}.logo-box img{max-width:100%;max-height:100%;object-fit:contain}.center{text-align:center;flex:1;color:#fff}.center h1{font-size:20px;color:#ffeb3b;font-weight:900}.center p{font-size:9px}.center h2{font-size:12px;color:#ffeb3b}.tabs{display:flex;background:#fff;border-bottom:2px solid #064e3b;position:sticky;top:0;z-index:10}.tabs button{flex:1;padding:13px;border:none;background:#f3f4f6;font-weight:800;cursor:pointer}.tabs button.active{background:#fff;color:#064e3b;border-bottom:3px solid #064e3b}.card{background:#fff;border-radius:14px;padding:14px;margin:10px;box-shadow:0 2px 6px rgba(0,0,0,.08)}.label{font-size:12px;font-weight:800;margin:10px 0 5px;display:block;color:#064e3b}.input,.select{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:8px;font-size:13px}.gps-box{padding:10px;border-radius:8px;font-size:12px;border:1px solid #10b981;background:#d1fae5;font-weight:600}.btn{padding:12px;border-radius:8px;border:none;font-weight:800;cursor:pointer}.btn-green{background:#064e3b;color:#fff;width:100%;margin-top:14px;font-size:15px}.page{display:none}.page.active{display:block}.record{border:1px solid #e5e7eb;border-radius:10px;padding:10px;margin:8px 0;background:#f9fafb}.record img{width:100%;border-radius:8px;margin-top:6px;max-height:220px;object-fit:cover}</style></head><body>
<div class="tabs"><button id="tabWorker" class="active" onclick="showPage('worker')">Worker App</button><button id="tabAdmin" onclick="showPage('admin')">Admin Portal</button></div>
<div class="header-new"><div class="logo-box"><img src="mediland-logo.jpg"></div><div class="center"><h1>BILLS DISTRIBUTION</h1><p>Mediland Pakistan Pvt Ltd - Suthra Punjab Agency - Tehsil Toba Tek Singh</p><h2>بلوں کی تقسیم - ستھرا پنجاب</h2></div><div class="logo-box"><img src="suthra-logo.jpg"></div></div>
<div id="workerPage" class="page active"><div class="card"><label class="label">Select Distributor *</label><select id="distributor" class="select"><option value="">-- Choose Your Name --</option><option>Mr Hanan</option><option>Mr Zubair</option><option>Ms Anila</option><option>Mr Waris Ali</option><option>Mr Faraz Ahmed</option><option>Mr Samiullah</option><option>Mr Zahid</option><option>Mr Faizan Javed</option><option>Mr Hussnain</option><option>Mr Usman</option></select><label class="label">House REF / Meter No *</label><input id="refNo" class="input" placeholder="e.g. METER-98745"><label class="label">LIVE GPS Location (Single Detail) *</label><div id="gpsStatus" class="gps-box">📍 LIVE GPS Loading...</div><button class="btn" style="width:100%;margin:6px 0;background:#fde68a" onclick="refreshGPS()">🔄 Refresh LIVE GPS</button><textarea id="liveAddr" class="input" style="height:80px;font-size:12px;background:#fffbeb" readonly placeholder="Full address ek hi baar yahan..."></textarea><label class="label">House / Meter Photo *</label><input type="file" id="photo" accept="image/*" capture="environment"><img id="imgPreview" style="display:none;width:100%;border-radius:10px;margin-top:8px;border:2px solid #064e3b"><button class="btn btn-green" onclick="submitData()">📸 Submit - Single Location Stamp</button><div id="msg" style="text-align:center;font-weight:800;margin-top:10px;color:#065f46"></div></div></div>
<div id="adminPage" class="page"><div class="card"><h3 style="color:#064e3b">📋 All Records (Admin Portal)</h3><div id="adminList"></div><button onclick="exportCSV()" style="margin-top:12px;padding:12px;background:#064e3b;color:#fff;border:none;border-radius:8px;width:100%;font-weight:800">📥 Download Excel CSV</button><button onclick="clearAll()" style="margin-top:8px;padding:10px;background:#fee2e2;color:#b91c1c;border:1px solid #fecaca;border-radius:8px;width:100%">🗑️ Clear All</button></div></div>
<canvas id="canvas" style="display:none"></canvas>
<script>
let gpsLat=null,gpsLong=null,gpsFullAddr="",currentImg=null;let records=JSON.parse(localStorage.getItem('mediland_records_v3')||'[]');let photos=JSON.parse(localStorage.getItem('mediland_photos_v3')||'[]');
function showPage(p){document.getElementById('workerPage').classList.remove('active');document.getElementById('adminPage').classList.remove('active');document.getElementById('tabWorker').classList.remove('active');document.getElementById('tabAdmin').classList.remove('active');if(p==='worker'){document.getElementById('workerPage').classList.add('active');document.getElementById('tabWorker').classList.add('active');}else{document.getElementById('adminPage').classList.add('active');document.getElementById('tabAdmin').classList.add('active');loadAdmin();}}
function refreshGPS(){let b=document.getElementById('gpsStatus');b.innerHTML="⏳ LIVE GPS fetching...";navigator.geolocation.getCurrentPosition(p=>{gpsLat=p.coords.latitude;gpsLong=p.coords.longitude;b.innerHTML=`✅ LIVE: ${gpsLat.toFixed(6)}, ${gpsLong.toFixed(6)} (±${Math.round(p.coords.accuracy)}m)`;fetch(`https://nominatim.openstreetmap.org/reverse?lat=${gpsLat}&lon=${gpsLong}&format=json&addressdetails=1&zoom=18`).then(r=>r.json()).then(d=>{let a=d.address||{};let disp=d.display_name||"";let chakM=disp.match(/Chak\s*\d+\s*[A-Z]*/i);let chak=chakM?chakM[0]:"Chak 381 JB";let road=a.road||a.hamlet||"Tahli - Kahlawan Road";let tehsil=a.county||"Tehsil Toba Tek Singh";if(!tehsil.toLowerCase().includes("tehsil"))tehsil="Tehsil "+tehsil;let district=a.state_district||"Toba Tek Singh";if(!district.toLowerCase().includes("district"))district="District "+district;gpsFullAddr=`${chak}, Toba Tek Singh, Punjab\n${road}, ${chak}, ${tehsil}, ${district}, Punjab, Pakistan`;document.getElementById('liveAddr').value=gpsFullAddr;});},{enableHighAccuracy:true,timeout:20000});}refreshGPS();
document.getElementById('photo').addEventListener('change',e=>{let f=e.target.files[0];let r=new FileReader();r.onload=ev=>{currentImg=new Image();currentImg.onload=()=>{document.getElementById('imgPreview').src=ev.target.result;document.getElementById('imgPreview').style.display='block';};currentImg.src=ev.target.result;};r.readAsDataURL(f);});
function submitData(){let dist=document.getElementById('distributor').value,ref=document.getElementById('refNo').value.trim();if(!dist||!ref||!gpsLat||!currentImg||!gpsFullAddr){alert('Name, REF, GPS, Photo lazmi!');return;}let now=new Date();let timeStr=now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:true});let dateStr=now.toLocaleDateString('en-GB',{day:'2-digit',month:'long',year:'numeric'})+" - "+now.toLocaleDateString('en-US',{weekday:'long'});let rec={id:Date.now(),name:dist,ref:ref,gps:`${gpsLat.toFixed(6)}, ${gpsLong.toFixed(6)}`,addr:gpsFullAddr,date:now.toISOString().slice(0,10),time:timeStr};let cv=document.getElementById('canvas'),ctx=cv.getContext('2d');cv.width=currentImg.width;cv.height=currentImg.height;ctx.drawImage(currentImg,0,0);let h=cv.height,w=cv.width;let stampH=Math.floor(h*0.30);ctx.fillStyle="rgba(0,0,0,0.78)";ctx.fillRect(0,h-stampH,w,stampH);let pad=Math.floor(w*0.03);let y=h-stampH+Math.floor(stampH*0.18);ctx.fillStyle="#fff";ctx.font=`bold ${Math.floor(h*0.038)}px Arial`;ctx.fillText(timeStr,pad,y);let timeW=ctx.measureText(timeStr).width;ctx.fillStyle="#facc15";ctx.fillRect(pad+timeW+12,y-Math.floor(h*0.022),3,Math.floor(h*0.035));ctx.fillStyle="#fff";ctx.font=`bold ${Math.floor(h*0.022)}px Arial`;ctx.fillText(dateStr,pad+timeW+22,y-2);y+=Math.floor(h*0.045);ctx.fillStyle="#fff";ctx.font=`bold ${Math.floor(h*0.024)}px Arial`;let addrLines=gpsFullAddr.split('\n');addrLines.forEach((ln,i)=>{if(i<2)ctx.fillText(ln,pad,y+i*Math.floor(h*0.032));});y+=addrLines.length*Math.floor(h*0.032)+Math.floor(h*0.015);ctx.fillStyle="#e5e7eb";ctx.font=`bold ${Math.floor(h*0.02)}px Arial`;ctx.fillText(`Lat ${gpsLat.toFixed(6)}° Long ${gpsLong.toFixed(6)}°`,pad,y);ctx.fillStyle="#facc15";ctx.font=`bold ${Math.floor(h*0.016)}px Arial`;ctx.fillText(`${dist} | REF: ${ref}`,pad,h-Math.floor(h*0.015));let stamped=cv.toDataURL('image/jpeg',0.90);records.push(rec);photos.push({id:rec.id,ref:ref,data:stamped});localStorage.setItem('mediland_records_v3',JSON.stringify(records));localStorage.setItem('mediland_photos_v3',JSON.stringify(photos));let a=document.createElement('a');a.download=`${dist}_${ref}.jpg`;a.href=stamped;a.click();document.getElementById('msg').innerHTML=`✅ Saved! ${dist} - ${ref} - Location 1 baar stamp hui!`;}
function loadAdmin(){let r=JSON.parse(localStorage.getItem('mediland_records_v3')||'[]');let p=JSON.parse(localStorage.getItem('mediland_photos_v3')||'[]');let el=document.getElementById('adminList');if(r.length==0){el.innerHTML='<p style="text-align:center;padding:20px;color:#666">No records</p>';return;}let h=`<p style="font-size:12px;font-weight:700;margin-bottom:8px">Total: ${r.length}</p>`;r.slice().reverse().forEach(rec=>{let ph=p.find(x=>x.id==rec.id);h+=`<div class="record"><b>${rec.name}</b> | REF: ${rec.ref}<br><small>${rec.addr.replace('\n',' | ')}</small><br><small>📍 ${rec.gps} | ${rec.date} ${rec.time}</small>${ph?`<img src="${ph.data}">`:''}</div>`;});el.innerHTML=h;}
function exportCSV(){let r=JSON.parse(localStorage.getItem('mediland_records_v3')||'[]');if(r.length==0){alert('No data');return;}let csv="Name,REF,Address,GPS,Date,Time\n";r.forEach(x=>{csv+=`"${x.name}","${x.ref}","${x.addr.replace(/\n/g,' ').replace(/"/g,'""')}","${x.gps}","${x.date}","${x.time}"\n`});let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='Mediland.csv';a.click();}
function clearAll(){if(confirm('Clear all?')){localStorage.removeItem('mediland_records_v3');localStorage.removeItem('mediland_photos_v3');records=[];photos=[];loadAdmin();}}
</script></body></html>
