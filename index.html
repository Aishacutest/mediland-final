<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>MEDILAND - FIXED WORKING</title>
<style>*{box-sizing:border-box;margin:0;padding:0;font-family:Arial}body{background:#eef2ee}.tabs{display:flex;position:sticky;top:0;z-index:10;background:#fff;border-bottom:3px solid #064e3b}.tabs button{flex:1;padding:14px;border:none;background:#eee;font-weight:900;cursor:pointer}.tabs button.active{background:#fff;color:#064e3b;border-bottom:3px solid #064e3b}.card{background:#fff;padding:14px;margin:10px;border-radius:12px}.input,.select{width:100%;padding:12px;border:1px solid #ccc;border-radius:8px}.gps{padding:12px;background:#d1fae5;border:2px solid #10b981;border-radius:8px;font-weight:700;font-size:12px}.btn{padding:12px;border:none;border-radius:8px;font-weight:800;cursor:pointer;width:100%;margin-top:8px}.btn-g{background:#064e3b;color:#fff}.page{display:none}.page.active{display:block}.gallery{display:grid;grid-template-columns:1fr 1fr;gap:8px}.g{border:1px solid #ddd;border-radius:10px;overflow:hidden;background:#fff}.g img{width:100%;height:130px;object-fit:cover}.g div{padding:6px;font-size:11px}.pin{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:99;display:none;align-items:center;justify-content:center;padding:20px}.pin-box{background:#fff;padding:20px;border-radius:12px;width:100%;max-width:300px;text-align:center}.pin-box input{width:100%;padding:12px;margin:10px 0;border:2px solid #064e3b;border-radius:8px;text-align:center}.zoom{position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:100;display:none;align-items:center;justify-content:center;flex-direction:column}.zoom img{max-width:95%;max-height:80vh;border-radius:10px}.zoom p{color:#fff;margin-top:8px}</style></head><body>
<script>if(location.search.includes('reset=1')){localStorage.clear();document.write('<h1 style="text-align:center;margin-top:50px">RESET DONE ✅<br><br><a href="./">Click Here to Open App</a></h1>');throw new Error('reset');}</script>
<div class="tabs"><button id="tW" class="active" onclick="showPage('worker')">👷 Worker App</button><button id="tA" onclick="showPage('admin')">🔐 Admin Portal</button></div>
<div style="background:#0a3d2a;color:#ffeb3b;text-align:center;padding:10px;font-weight:900">BILLS DISTRIBUTION - MEDILAND - Suthra Punjab</div>

<div id="workerPage" class="page active">
<div class="card"><b>Total: <span id="wTot">0</span> | Today: <span id="wTod">0</span> | My: <span id="wMy">0</span></b><p id="wInfo" style="font-size:11px;color:#666"></p></div>
<div class="card">
<label style="font-weight:800;color:#064e3b;font-size:12px">Select Distributor * (10 Workers)</label>
<select id="dist" class="select"><option value="">-- Choose Your Name --</option><option>Mr Hanan</option><option>Mr Zubair</option><option>Ms Anila</option><option>Mr Waris Ali</option><option>Mr Faraz Ahmed</option><option>Mr Samiullah</option><option>Mr Zahid</option><option>Mr Faizan Javed</option><option>Mr Hussnain</option><option>Mr Usman</option></select>
<label style="font-weight:800;color:#064e3b;font-size:12px;margin-top:10px;display:block">House REF *</label><input id="ref" class="input" placeholder="381 JB">
<label style="font-weight:800;color:#064e3b;font-size:12px;margin-top:10px;display:block">LIVE GPS</label><div id="gpsTxt" class="gps">📍 Allow + GPS ON</div>
<button class="btn" style="background:#ffeb3b;margin-top:6px" onclick="getGPS()">🔄 Refresh GPS</button>
<textarea id="addr" class="input" style="height:80px;background:#fffde7;margin-top:6px;font-size:11px;font-weight:700" readonly></textarea>
<input type="file" id="photoFile" accept="image/*" capture="environment" style="margin-top:10px">
<img id="prev" style="display:none;width:100%;border-radius:10px;margin-top:8px;border:2px solid #064e3b" onclick="openZoom(this.src)">
<button class="btn btn-g" onclick="saveData()">📸 Submit</button><div id="msg" style="text-align:center;font-weight:800;color:green;margin-top:8px"></div>
</div>
</div>

<div id="adminPage" class="page">
<div class="card" style="background:#064e3b;color:#fff;text-align:center;font-weight:900;font-size:18px">📦 Total Bills: <span id="aTotal">0</span></div>
<div class="card"><h4>Worker Counting</h4><div id="overList" style="margin-top:8px"></div></div>
<div class="card"><h4>👥 10 Workers List</h4><div id="manageW" style="margin-top:8px"></div></div>
<div class="card"><h4>Gallery - Edit / Delete / Zoom</h4><div style="display:flex;gap:6px;margin-top:8px"><input type="date" id="fDate" class="input" onchange="loadAdmin()"><select id="fDist" class="select" onchange="loadAdmin()"><option value="">All Workers</option><option>Mr Hanan</option><option>Mr Zubair</option><option>Ms Anila</option><option>Mr Waris Ali</option><option>Mr Faraz Ahmed</option><option>Mr Samiullah</option><option>Mr Zahid</option><option>Mr Faizan Javed</option><option>Mr Hussnain</option><option>Mr Usman</option></select></div><div id="gal" class="gallery" style="margin-top:10px"></div></div>
<div class="card"><button class="btn" style="background:#fee2e2;color:#b91c1c" onclick="clearAll()">🗑️ Clear All Data</button></div>
</div>

<div id="wPin" class="pin"><div class="pin-box"><h3>Worker PIN</h3><p>Default 1111</p><input id="wPinIn" type="password" placeholder="PIN"><button class="btn btn-g" onclick="checkW()">Unlock Worker</button></div></div>
<div id="aPin" class="pin"><div class="pin-box"><h3>Admin PIN</h3><p>Default 381381</p><input id="aPinIn" type="password" placeholder="PIN"><button class="btn btn-g" onclick="checkA()">Unlock Admin</button><br><button class="btn" style="background:#eee;margin-top:8px" onclick="forceOpen()">⚠️ Emergency Open (No PIN)</button></div></div>
<div id="zBox" class="zoom" onclick="closeZoom()"><img id="zImg"><p id="zTxt"></p></div>
<canvas id="can" style="display:none"></canvas>
<script>
let WORKERS=["Mr Hanan","Mr Zubair","Ms Anila","Mr Waris Ali","Mr Faraz Ahmed","Mr Samiullah","Mr Zahid","Mr Faizan Javed","Mr Hussnain","Mr Usman"];
let WPIN="1111",APIN="381381",lat=null,lon=null,fullAddr="",curImg=null;
let wUnlock=localStorage.getItem('w_un')==='yes',aUnlock=false;
function showPage(p){
 if(p==='worker'&&!wUnlock){document.getElementById('wPin').style.display='flex';return;}
 if(p==='admin'&&!aUnlock){document.getElementById('aPin').style.display='flex';return;}
 document.getElementById('workerPage').classList.remove('active');document.getElementById('adminPage').classList.remove('active');
 document.getElementById('tW').classList.remove('active');document.getElementById('tA').classList.remove('active');
 if(p==='worker'){document.getElementById('workerPage').classList.add('active');document.getElementById('tW').classList.add('active');upd();if(!lat)getGPS();}
 else{document.getElementById('adminPage').classList.add('active');document.getElementById('tA').classList.add('active');loadAdmin();}
}
function checkW(){if(document.getElementById('wPinIn').value===WPIN){wUnlock=true;localStorage.setItem('w_un','yes');document.getElementById('wPin').style.display='none';showPage('worker');}else alert('Wrong');}
function checkA(){if(document.getElementById('aPinIn').value===APIN){aUnlock=true;document.getElementById('aPin').style.display='none';showPage('admin');}else alert('Wrong');}
function forceOpen(){aUnlock=true;wUnlock=true;localStorage.setItem('w_un','yes');document.getElementById('wPin').style.display='none';document.getElementById('aPin').style.display='none';showPage('admin');}
function getR(){try{return JSON.parse(localStorage.getItem('mediland_records_v5')||'[]');}catch(e){return [];}}
function getP(){try{return JSON.parse(localStorage.getItem('mediland_photos_v5')||'[]');}catch(e){return [];}}
function saveR(r){localStorage.setItem('mediland_records_v5',JSON.stringify(r));}
function saveP(p){localStorage.setItem('mediland_photos_v5',JSON.stringify(p));}
function upd(){let r=getR();let today=new Date().toISOString().slice(0,10);document.getElementById('wTot').innerText=r.length;document.getElementById('aTotal').innerText=r.length;document.getElementById('wTod').innerText=r.filter(x=>x.date===today).length;let name=document.getElementById('dist').value;if(name){let my=r.filter(x=>x.name===name);document.getElementById('wMy').innerText=my.length;document.getElementById('wInfo').innerText=name+': Total '+my.length;}else document.getElementById('wMy').innerText=0;}
document.getElementById('dist').addEventListener('change',upd);
function getGPS(){let b=document.getElementById('gpsTxt');b.innerHTML="⏳ Finding...";navigator.geolocation.getCurrentPosition(async p=>{lat=p.coords.latitude;lon=p.coords.longitude;fullAddr="Chak 381 JB, Toba Tek Singh - Lat "+lat.toFixed(5)+" Long "+lon.toFixed(5);try{let r=await fetch(`https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lon}&format=json`);let d=await r.json();fullAddr=d.display_name||fullAddr;}catch(e){}document.getElementById('addr').value=fullAddr;b.innerHTML="✅ "+lat.toFixed(5)+","+lon.toFixed(5);},err=>{b.innerHTML="❌ GPS Allow karein";},{enableHighAccuracy:true,timeout:15000});}
document.getElementById('photoFile').addEventListener('change',e=>{let f=e.target.files[0];let r=new FileReader();r.onload=ev=>{curImg=new Image();curImg.onload=()=>{document.getElementById('prev').src=ev.target.result;document.getElementById('prev').style.display='block';};curImg.src=ev.target.result;};r.readAsDataURL(f);});
function saveData(){let d=document.getElementById('dist').value,ref=document.getElementById('ref').value.trim();if(!d)return alert('Select Distributor - 10 me se naam choose karo');if(!ref)return alert('REF');if(!lat)return alert('GPS Refresh');if(!curImg)return alert('Photo');let now=new Date();let rec={id:Date.now(),name:d,ref:ref,gps:lat.toFixed(6)+","+lon.toFixed(6),addr:fullAddr,date:now.toISOString().slice(0,10),time:now.toLocaleTimeString()};let cv=document.getElementById('can'),ctx=cv.getContext('2d');cv.width=curImg.width;cv.height=curImg.height;ctx.drawImage(curImg,0,0);ctx.fillStyle="rgba(0,0,0,0.7)";ctx.fillRect(0,cv.height-60,cv.width,60);ctx.fillStyle="#ffeb3b";ctx.font="bold 14px Arial";ctx.fillText(d+" | REF: "+ref+" | "+now.toLocaleTimeString(),10,cv.height-15);let stamped=cv.toDataURL('image/jpeg',0.8);let recs=getR();let phs=getP();recs.push(rec);phs.push({id:rec.id,name:d,ref:ref,data:stamped,[STRIPPED] a=document.createElement('a');a.download=d+'_'+ref+'.jpg';a.href=stamped;a.click();document.getElementById('msg').innerText='✅ Saved!';upd();}
function openZoom(src,txt){document.getElementById('zImg').src=src;document.getElementById('zTxt').innerText=txt||'';document.getElementById('zBox').style.display='flex';}
function closeZoom(){document.getElementById('zBox').style.display='none';}
function delPhoto(id){if(!confirm('Delete?'))return;let r=getR(),p=getP();r=r.filter(x=>x.id!==id);p=p.filter(x=>x.id!==id);saveR(r);saveP(p);loadAdmin();upd();}
function loadAdmin(){let r=getR(),p=getP(),fDate=document.getElementById('fDate').value,fDist=document.getElementById('fDist').value;let map={};r.forEach(x=>{if(fDate&&x.date!==fDate)return;map[x.name]=(map[x.name]||0)+1;});let h='';for(let k in map)h+=`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid #eee"><b>${k}</b><span>${map[k]}</span></div>`;document.getElementById('overList').innerHTML=h||'No data';let fp=p;if(fDate)fp=fp.filter(x=>x.date===fDate);if(fDist)fp=fp.filter(x=>x.name===fDist);let gEl=document.getElementById('gal');if(fp.length==0)gEl.innerHTML='<p style="grid-column:1/-1;text-align:center;padding:15px;color:#666">No photos</p>';else{let hg='';fp.slice().reverse().forEach(ph=>{hg+=`<div class="g"><img src="${ph.data}" onclick="openZoom('${ph.data}','${ph.name} | ${ph.ref}')"><div><b>${ph.name}</b> | ${ph.ref}<br><small>${ph.date}</small><br><button style="background:#dc3545;color:#fff;border:none;padding:5px 10px;border-radius:5px;margin-top:4px;width:100%" onclick="delPhoto(${ph.id})">🗑️ Delete</button></div></div>`;});gEl.innerHTML=hg;}let wH='';WORKERS.forEach(w=>{wH+=`<div style="display:flex;justify-content:space-between;padding:8px;border:1px solid #eee;border-radius:8px;margin:5px 0"><span>👤 ${w}</span><span style="color:green">Active</span></div>`;});document.getElementById('manageW').innerHTML=wH;}
function clearAll(){if(confirm('All delete?')){localStorage.removeItem('mediland_records_v5');localStorage.removeItem('mediland_photos_v5');loadAdmin();upd();}}
// INIT - 100% WORKING
(function(){let m=document.getElementById('manageW');let wh='';WORKERS.forEach(w=>{wh+=`<div style="display:flex;justify-content:space-between;padding:8px;border:1px solid #eee;border-radius:8px;margin:5px 0"><span>👤 ${w}</span><span style="color:green">Active</span></div>`;});if(m)m.innerHTML=wh;upd();loadAdmin();if(!wUnlock){document.getElementById('wPin').style.display='flex';}else{getGPS();}})();
</script></body></html>
